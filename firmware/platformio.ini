; Auto Hydro HMI — Elecrow CrowPanel ESP32 HMI 7.0" (ESP32-S3-WROOM-1-N4R8)
;
;   pio run -e crowpanel7-mock -t upload   ; UI with synthetic telemetry
;   pio run -e crowpanel7 -t upload        ; talks to Parker's controller
;   pio test -e native                     ; logic tests, no hardware
;
; UART0 (IO43/IO44) is both the USB serial port and the Parker link, so the
; firmware never prints to it. Debug output goes to the on-screen log.

[platformio]
default_envs = crowpanel7

[env]
build_flags = -std=gnu++17

[esp32_base]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; N4R8: 4 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv       ; LVGL + Arduino does not fit the default app slot
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@^9.6.0                        ; 9.6 renamed the obj-flag helpers used in ui.cpp
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0             ; keep Serial on UART0, not native USB
    -DLV_CONF_SKIP=1                        ; configure LVGL from flags, no lv_conf.h to drift
    -DLV_COLOR_DEPTH=16
    -DLV_MEM_SIZE=65536                     ; plain integer: parentheses break the build shell
    -DLV_DEF_REFR_PERIOD=33
    -DLV_USE_LOG=0
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1

[env:crowpanel7]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DAUTOHYDRO_MOCK=0
build_src_filter = +<*> -<mock_link.cpp>

[env:crowpanel7-mock]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DAUTOHYDRO_MOCK=1

; Host build of the hardware-independent layers: moisture scaling, NDJSON line
; splitting, link/ack/alarm state machine, and the mock scenario.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags =
    -std=gnu++17
    -Iinclude
    -DAUTOHYDRO_MOCK=1
build_src_filter = +<app_state.cpp> +<protocol.cpp> +<mock_link.cpp>
