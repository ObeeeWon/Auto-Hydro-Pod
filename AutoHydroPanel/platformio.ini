; Auto Hydro panel firmware — CrowPanel ESP32 HMI 7.0" (ESP32-S3-WROOM-1-N4R8).
;
;   pio run -e panel-mock -t upload   ; synthetic telemetry, no controller needed
;   pio run -e panel -t upload        ; live UART0 link to Parker's controller
;
; This folder is deliberately flat so the same sources build in the Arduino IDE
; as well (see README.md). src_dir points at the folder itself rather than src/.
;
; UART0 (IO43/IO44) is both the USB serial port and the Parker link, so the
; firmware never prints to it. Debug output goes to the on-screen log.

[platformio]
default_envs = panel-mock
src_dir = .
include_dir = .

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; N4R8: 4 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv       ; LVGL + Arduino does not fit the default app slot
monitor_speed = 115200

lib_deps =
    lvgl/lvgl@^9.6.0                        ; 9.6 renamed the obj-flag helpers used in ui.cpp
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0             ; keep Serial on UART0, not native USB
    -DLV_CONF_SKIP=1                        ; LVGL configured from the flags below.
                                            ; The Arduino IDE cannot pass flags, so it
                                            ; reads lv_conf.h instead — keep the two in sync.
    -DLV_COLOR_DEPTH=16
    -DLV_MEM_SIZE=65536                     ; plain integer: parentheses break the build shell
    -DLV_DEF_REFR_PERIOD=33
    -DLV_USE_LOG=0
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1

; Flash this one first. mock_link.cpp generates telemetry locally, so the panel
; proves its own screen, touch and test indicator with no controller attached.
[env:panel-mock]
build_flags = ${env.build_flags} -DAUTOHYDRO_MOCK=1

; Flash this once the screen is proven and the UART is wired.
; mock_link.cpp compiles away to nothing here via #if AUTOHYDRO_MOCK.
[env:panel]
build_flags = ${env.build_flags} -DAUTOHYDRO_MOCK=0
